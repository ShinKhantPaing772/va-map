    <text x="32" y="39" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">MINIMAL DISPATCH</text>
    <text x="32" y="56" fill="#6b7280" font-family="Inter, Arial, sans-serif" font-size="12">Clean airline tool</text>
  </g>

  <g transform="translate(976 140)" filter="url(#shadow)">
    <rect width="400" height="250" rx="14" fill="url(#sat)"/>
    <path d="M0 152C72 121 108 107 154 128C198 147 211 105 260 84C310 63 354 80 400 50V250H0Z" fill="#183d5a" opacity=".7"/>
    <path d="M0 52C54 83 98 63 145 44C197 23 259 31 299 66C332 95 363 98 400 83V0H0Z" fill="#778864" opacity=".85"/>
    <path d="M60 188L135 157L214 126L325 77" fill="none" stroke="#fffbeb" stroke-width="4" stroke-linecap="round"/>
    <g fill="#fffbeb" stroke="#0f172a" stroke-width="2">
      <circle cx="135" cy="157" r="9"/>
      <circle cx="214" cy="126" r="9"/>
      <circle cx="325" cy="77" r="9"/>
    </g>
    <rect x="18" y="18" width="150" height="48" rx="10" fill="rgba(15,23,42,.72)" stroke="rgba(255,255,255,.2)"/>
    <text x="32" y="39" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">SATELLITE HYBRID</text>
    <text x="32" y="56" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="12">Immersive terrain</text>
  </g>

  <g transform="translate(64 470)" filter="url(#shadow)">
    <rect width="400" height="250" rx="14" fill="#061b33"/>
    <rect width="400" height="250" rx="14" fill="url(#grid)"/>
    <path d="M24 86C82 62 133 79 177 106C222 134 259 118 307 84C345 57 374 67 394 83" fill="none" stroke="#5eead4" stroke-opacity=".35" stroke-width="2"/>
    <path d="M44 203L118 161L206 120L327 56" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <g fill="#5eead4">
      <path d="M118 151l16 10-16 10-4-7h-17v-6h17z"/>
      <path d="M206 110l16 10-16 10-4-7h-17v-6h17z"/>
      <path d="M327 46l16 10-16 10-4-7h-17v-6h17z"/>
    </g>
    <rect x="18" y="18" width="166" height="48" rx="10" fill="#08233f" stroke="#1e75a8"/>
    <text x="32" y="39" fill="#7dd3fc" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">BLUEPRINT CHART</text>
    <text x="32" y="56" fill="#bdd7ee" font-family="Inter, Arial, sans-serif" font-size="12">Aviation blueprint</text>
  </g>

  <g transform="translate(520 470)" filter="url(#shadow)">
    <rect width="400" height="250" rx="14" fill="url(#cz)"/>
    <path d="M0 167C55 149 98 139 144 159C196 181 238 151 281 128C327 103 361 107 400 131V250H0Z" fill="#d9eef5"/>
    <path d="M44 199L123 159L214 128L333 73" fill="none" stroke="#007d8f" stroke-width="4" stroke-linecap="round"/>
    <g>
      <circle cx="123" cy="159" r="11" fill="#e60012"/>
      <circle cx="214" cy="128" r="11" fill="#007d8f"/>
      <circle cx="333" cy="73" r="11" fill="#e60012"/>
    </g>
    <rect x="18" y="18" width="190" height="48" rx="10" fill="#ffffff" stroke="#dbe4ea"/>
    <text x="32" y="39" fill="#007d8f" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">CHINA SOUTHERN</text>
    <text x="32" y="56" fill="#65758a" font-family="Inter, Arial, sans-serif" font-size="12">Teal with red alerts</text>
  </g>

  <g transform="translate(976 470)" filter="url(#shadow)">
    <rect width="400" height="250" rx="14" fill="#000000"/>
    <path d="M20 72C83 97 134 67 185 47C236 27 286 37 333 68C358 84 376 90 400 83" fill="none" stroke="#28ff6a" stroke-opacity=".28" stroke-width="2"/>
    <path d="M0 182C63 142 114 128 174 146C230 163 265 136 311 121C351 108 377 112 400 127" fill="none" stroke="#28ff6a" stroke-opacity=".22" stroke-width="2"/>
    <circle cx="200" cy="125" r="102" fill="none" stroke="#28ff6a" stroke-opacity=".12"/>
    <path d="M54 201L129 162L221 117L345 55" fill="none" stroke="#28ff6a" stroke-width="2" stroke-linecap="round"/>
    <g fill="#ffdd4a">
      <text x="121" y="162" font-size="20">✈</text>
      <text x="213" y="117" font-size="20">✈</text>
      <text x="337" y="55" font-size="20">✈</text>
    </g>
    <rect x="18" y="18" width="154" height="48" rx="10" fill="#050505" stroke="#194d29"/>
    <text x="32" y="39" fill="#28ff6a" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">HIGH CONTRAST ATC</text>
    <text x="32" y="56" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="12">Maximum readability</text>
  </g>

  <text x="64" y="825" fill="#132033" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">My ranking for your app</text>
  <text x="64" y="862" fill="#475467" font-family="Inter, Arial, sans-serif" font-size="18">1. Dark Radar: best live-tracking mood and strong marker contrast.</text>
  <text x="64" y="894" fill="#475467" font-family="Inter, Arial, sans-serif" font-size="18">2. Blueprint Chart: distinctive aviation flavor without becoming visually noisy.</text>
  <text x="64" y="926" fill="#475467" font-family="Inter, Arial, sans-serif" font-size="18">3. Minimal Dispatch: cleanest if this should feel like an operational dashboard.</text>
</svg>
