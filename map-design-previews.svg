<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <pattern id="scan" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 0H12" stroke="#39ff9f" stroke-opacity=".08"/>
    </pattern>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#50d7ff" stroke-opacity=".16"/>
    </pattern>
    <linearGradient id="sat" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#355c39"/>
      <stop offset=".45" stop-color="#7f8f66"/>
      <stop offset="1" stop-color="#28475f"/>
    </linearGradient>
    <linearGradient id="cz" x1="0" x2="1">
      <stop stop-color="#eaf7fb"/>
      <stop offset="1" stop-color="#f8fbfd"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="980" fill="#eef2f6"/>
  <text x="64" y="68" fill="#132033" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">Map Design Previews</text>
  <text x="64" y="100" fill="#667085" font-family="Inter, Arial, sans-serif" font-size="18">Six possible visual directions for the CZVG live flight tracker</text>

  <!-- Panel helper: each panel is 400x250 -->
  <g transform="translate(64 140)" filter="url(#shadow)">
    <rect width="400" height="250" rx="14" fill="#071017"/>
    <rect width="400" height="250" rx="14" fill="url(#scan)"/>
    <path d="M28 184C84 143 115 103 179 128C244 154 277 86 369 74" fill="none" stroke="#8aa0af" stroke-opacity=".28" stroke-width="2"/>
    <path d="M54 52C94 69 126 84 160 61C204 31 249 50 290 83C325 111 350 123 376 111" fill="none" stroke="#8aa0af" stroke-opacity=".2" stroke-width="2"/>
    <circle cx="200" cy="125" r="95" fill="none" stroke="#39ff9f" stroke-opacity=".15"/>
    <circle cx="200" cy="125" r="50" fill="none" stroke="#39ff9f" stroke-opacity=".18"/>
    <path d="M64 205L132 165L228 139L334 68" fill="none" stroke="#39ff9f" stroke-width="3" stroke-linecap="round"/>
    <g fill="#39ff9f">
      <text x="126" y="164" font-size="22">✈</text>
      <text x="221" y="139" font-size="22">✈</text>
      <text x="326" y="68" font-size="22">✈</text>
    </g>
    <rect x="18" y="18" width="136" height="48" rx="10" fill="#0b1821" stroke="#1d3b46"/>
    <text x="32" y="39" fill="#9debc6" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="800">DARK RADAR</text>
    <text x="32" y="56" fill="#c7d2da" font-family="Inter, Arial, sans-serif" font-size="12">Ops center feel</text>
  </g>

  <g transform="translate(520 140)" filter="url(#shadow)">
    <rect width="400" height="250" rx="14" fill="#f9fafb"/>
    <path d="M32 72C75 54 111 64 152 91C200 123 249 84 286 67C319 52 356 59 380 88" fill="none" stroke="#d0d7de" stroke-width="8" stroke-linecap="round"/>
    <path d="M35 175C79 149 115 136 162 154C210 172 241 151 286 139C327 128 355 137 378 158" fill="none" stroke="#c7d2fe" stroke-width="3" stroke-linecap="round"/>
    <path d="M58 198L151 151L246 126L343 72" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
    <g fill="#2563eb">
      <circle cx="151" cy="151" r="7"/>
      <circle cx="246" cy="126" r="7"/>
      <circle cx="343" cy="72" r="7"/>
    </g>
